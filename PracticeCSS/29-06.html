<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .a{
            height: 200px;
            width: 200px;
            background-color: brown;
            margin-left: 50px;
            margin-top: 50px;
           
            
        }
        .a:hover{
            background-color: aqua;
            transition-delay: 2s;
            transition-duration: 5s;
            transform: translateY(200px);
            
        }

        .b{
            background-color: darkorange;
            height: 200px;
            width: 200px;
            margin-left: 100px;
            margin-top: 100px;
            border-radius: 100px;
        }
        .b:hover{
            background-color: crimson;
            transform: scale(2);
            transition-delay: 2s;
            transition-duration: 2s;

        }
        .c{
            background-color: green;
            height: 200px;
            width: 200px;
            margin-left: 200px;
            margin-top: 100px;

        }
        .c:hover{
            background-color: greenyellow;
            transform: translateX(200px);
            
        }
        .d{
            height: 200px;
            width: 200px;
            margin-left: 200px;
            margin-top: 100px;
            background-color: gold;
            border-radius: 20px;

        }
        .d:hover{
            background-color: brown;
            /* transform: rotate(300deg); */
            /* transform: rotateX(200deg); */
            transform: rotateY(200deg);
            transition-duration: 3s;

        }
        .e{
            background-color: black;
            height: 300px;
            width: 200px;
            border-radius: 80px;
            margin-left: 500px;
        }
        .e:hover{
            background-color: aqua;
            transform: skew(40deg);
            transition-duration: 2s;
        }
        .f{
            height: 400px;
            width: 200px;
            background-color: lawngreen;
            margin-left: 200px;

        }
        .f:hover{
            background-color: blue;
            transition-duration: 3s;
            transform: matrix(1.2, 0.36, 0.58, 1.1, 300px, 200px);
        }

    </style>
</head>
<body>
    <div class="a">
        
    </div>

    <div class="b">

    </div>
    <div class="c">
        
    </div>
    <div class="d">

    </div>
    <div class="e">

    </div>
    <div class="f">

    </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background-color: burlywood;
    }
    .moto{
      
        height: 400px;
        width: 800px;
        margin: auto;
        margin-top: 100px;
        display: flex;
        box-shadow: 0 0 40px;
        

    }
    .a{
        background-color: white;
        width: 400px;
      border-top-left-radius: 30px;
      border-bottom-left-radius:30px ;
        
        

    }

    .b{
        background-color: rgb(89, 213, 244);
        width: 400px;
        border-top-right-radius: 30px;
        border-bottom-right-radius: 30px ;
        
        
  
    }
    .piano h2{
       text-align: center;
       padding-top: 50px;

    }

    .guitar a{
       
        padding-left: 50px;
        text-decoration: none;
       
       
    }

    .drum{
        text-align: center;
        padding-top: 30px;
         
    }

    .violin p{
        text-align: center;
    }

    .trumpet{
        text-align: center;
      
    }
    .trumpet button{
        border-radius: 20px;
        background-color: rgb(89, 213, 244);
        border-color: rgb(89, 213, 244);
        
       
    }
    .red{
        color: white;
        text-align: center;
        padding-top: 130px;
    }
    .yellow{
        text-align: center;
        color: white;

    }

    .congo{
        text-align: center;
       
    }

    .congo button{
        background-color: rgb(89, 213, 244);
        color: white;
        border-radius: 20px;
        border-color: white;
    }

    
        
    
   
</style>
<body>
    <div class="moto">
        <div class="a">
            <div class="piano">
                <h2>Sign in</h2>
            </div>

            <div class="guitar">
                <a href="https://www.facebook.com/">
                    <img src="https://images.seeklogo.com/logo-png/30/1/facebook-icon-logo-png_seeklogo-306459.png" height="50px" width="50px">
                </a>
                <a href="https://www.google.com/">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTwTtAcNvKX55_-g-phmybzA17c6vb6QAlAng&s" height="50px" width="50px">
                </a>
                <a href="https://www.instagram.com/">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuH7c5cLpGehi0b4iQk90fXUzC9p7Ebla13w&s" height="50px" width="50px">
                </a>

            </div>

            <div class="drum">
                <input type="email" name="email" id="email" placeholder="User Email"> <br> <br>
                <input type="password" placeholder="password">
            </div>

            <div class="violin">

                <p>Forget your password?</p> 

            </div>

            <div class="trumpet">

                <button>Sign in</button>


            </div>

            


        </div>

        <div class="b">
            <div class="red">
                <h2>Sign UP</h2>
            </div>

            <div class="yellow">
                <p>Sign up here if you have an account</p>
            </div>

            <div class="congo">
                <button>Sign Up</button>

            </div>

        </div>

    </div>
   





   

    
</body>
</html>
